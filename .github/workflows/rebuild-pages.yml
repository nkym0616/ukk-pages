name: Build and publish UKK Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "scripts/prepare-pages.mjs"
      - "vite.pages.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/rebuild-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ukk-pages-build
  cancel-in-progress: false

jobs:
  build-and-sync:
    # The generated commit only changes root deployment files, which are outside
    # the push trigger paths above. This prevents a build loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and inspect the public frontend
        run: pnpm build:pages

      - name: Sync only compiled public files to the Pages root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-artifact
          mkdir .pages-artifact
          cp -a dist-pages/. .pages-artifact/
          rm -f .pages-artifact/.gitkeep
          git rm -rf --ignore-unmatch assets index.html 404.html manus-routes.json ukk-logo.svg .nojekyll
          cp -a .pages-artifact/. .
          rm -rf .pages-artifact
          git add assets index.html 404.html manus-routes.json ukk-logo.svg .nojekyll
          if git diff --cached --quiet; then
            echo "The published files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild Pages frontend [skip pages]"
          git push
